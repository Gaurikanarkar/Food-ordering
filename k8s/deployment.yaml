apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-website-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: food-website
  template:
    metadata:
      labels:
        app: food-website
    spec:
      containers:
        - name: food-website
          image: nexus-service-for-docker-hosted-registry.nexus.svc.cluster.local:8085/my-repository/2401086_food-ordering/food-ordering:v1
          ports:
            - containerPort: 80
