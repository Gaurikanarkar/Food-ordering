apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-website-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: food-website
  template:
    metadata:
      labels:
        app: food-website
    spec:
      containers:
        - name: food-website
          image: your-dockerhub-username/food-website:latest
          ports:
            - containerPort: 80
