# -------------------------------
# DO NOT USE PVC FOR STATIC FILES
# Keeping PVC here but not using it
# -------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: food-static-pvc
  namespace: "2401086"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-ordering-deployment
  namespace: "2401086"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: food-ordering
  template:
    metadata:
      labels:
        app: food-ordering
    spec:
      imagePullSecrets:
        - name: nexus-secret
      containers:
        - name: food-ordering
          image: 127.0.0.1:30085/2401086/food-ordering:v5
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          env:
            - name: VITE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: spoonacular-secret
                  key: SPOONACULAR_API_KEY

          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: food-ordering-service
  namespace: "2401086"
spec:
  selector:
    app: food-ordering
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: food-ordering-ingress
  namespace: "2401086"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: 2401086.imcc.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: food-ordering-service
                port:
                  number: 80
