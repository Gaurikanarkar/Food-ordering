apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: food-ordering-ingress
  namespace: "2401086"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: 2401086.imcc.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: food-ordering-service
                port:
                  number: 80
