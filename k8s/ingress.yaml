apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: food-ordering-frontend-ingress
  namespace: "2401086"
spec:
  ingressClassName: nginx
  rules:
    - host: 2401086.imcc.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: food-ordering-frontend-service
                port:
                  number: 80
